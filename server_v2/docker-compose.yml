version: '3.9'

services:
  api:
    build: .
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/youtube-tool?schema=public'
      REDIS_URL: 'redis://redis:6379/0'
      QUEUE_DRIVER: redis
      BLOB_BACKEND: s3
      S3_ENDPOINT: 'http://minio:9000'
      S3_BUCKET: uploads
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: miniosecret
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
      SMTP_HOST: mail
      SMTP_PORT: 1025
      SMTP_USER: ''
      SMTP_PASS: ''
      WORK_DIR: /app/workspace
      QUEUE_CONCURRENCY: 2
    depends_on:
      - postgres
      - redis
      - minio
      - clamav
      - otel-collector
    volumes:
      - ./workspace:/app/workspace
      - ./data:/app/data

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: youtube-tool
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  clamav:
    image: mkodockx/docker-clamav:alpine
    ports:
      - '3310:3310'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - '4318:4318'

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - otel-collector

volumes:
  minio-data: {}
