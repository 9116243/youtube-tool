[package]
name = "youtube-tool"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-path = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
which = "6"
nanoid = "0.4"
