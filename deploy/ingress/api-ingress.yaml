apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: youtube-api
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: api.example.com # replace with PUBLIC_BASE_URL host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: youtube-api
                port:
                  number: 3001
