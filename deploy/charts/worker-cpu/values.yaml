replicaCount: 1

image:
  repository: ghcr.io/example
  name: worker-cpu
  tag: latest
  pullPolicy: IfNotPresent

resources: {}

env:
  NODE_ENV: production
  LOG_LEVEL: info
  DEV_TOOLS: "false"

redis:
  url: redis://redis.default.svc.cluster.local:6379

temporal:
  host: temporal.default.svc.cluster.local:7233
  namespace: default
  taskQueue: video-cpu
  workflowQueue: video-pipeline
  sseSecret: temporal-sse-secret

workspace:
  mountPath: /workspace
  enabled: true
  emptyDir: {}

secret:
  jwtSecret: dev-secret

nodeSelector: {}
tolerations: []
affinity: {}
