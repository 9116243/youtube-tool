apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worker-cpu.fullname" . }}
  labels:
    {{ include "worker-cpu.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "worker-cpu.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "worker-cpu.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: worker-cpu
          image: {{ include "worker-cpu.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: WORK_DIR
              value: {{ .Values.workspace.mountPath | quote }}
            - name: TEMPORAL_HOST
              value: {{ .Values.temporal.host | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            - name: TEMPORAL_TASK_QUEUE_CPU
              value: {{ .Values.temporal.taskQueue | quote }}
            - name: TEMPORAL_WORKFLOW_TASK_QUEUE
              value: {{ .Values.temporal.workflowQueue | quote }}
            - name: TEMPORAL_SSE_SECRET
              value: {{ .Values.temporal.sseSecret | quote }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "worker-cpu.fullname" . }}-secret
                  key: JWT_SECRET
          envFrom:
            - configMapRef:
                name: {{ include "worker-cpu.fullname" . }}-config
          {{- if .Values.resources }}
          resources:
{{ toYaml .Values.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.workspace.enabled }}
          volumeMounts:
            - name: workspace
              mountPath: {{ .Values.workspace.mountPath }}
          {{- end }}
{{- if .Values.workspace.enabled }}
      volumes:
        - name: workspace
          {{- if .Values.workspace.emptyDir }}
          emptyDir:
{{ toYaml .Values.workspace.emptyDir | nindent 10 }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
{{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 6 }}
{{- end }}
{{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 6 }}
{{- end }}
{{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 6 }}
{{- end }}
