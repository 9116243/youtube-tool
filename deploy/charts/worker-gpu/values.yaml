replicaCount: 1

image:
  repository: ghcr.io/example
  name: worker-gpu
  tag: latest
  pullPolicy: IfNotPresent

resources: {}

env:
  NODE_ENV: production
  LOG_LEVEL: info
  DEV_TOOLS: "false"

redis:
  url: redis://redis.default.svc.cluster.local:6379

temporal:
  host: temporal.default.svc.cluster.local:7233
  namespace: default
  taskQueue: video-gpu
  workflowQueue: video-pipeline
  sseSecret: temporal-sse-secret

workspace:
  mountPath: /workspace
  enabled: true
  emptyDir: {}

secret:
  jwtSecret: dev-secret

nodeSelector:
  nvidia.com/gpu: "true"

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

affinity: {}
