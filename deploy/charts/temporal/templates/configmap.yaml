apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "temporal.fullname" . }}-config
  labels:
    {{ include "temporal.labels" . | indent 4 }}
data:
{{- if .Values.env }}
{{- range $key, $value := .Values.env }}
  {{ $key }}: {{ quote $value }}
{{- end }}
{{- else }}
  TEMPORAL_NAMESPACE: default
{{- end }}
