name: docker-ci
on:
  push:
    branches:
      - main
    paths:
      - 'server_v2/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (load to local)
        working-directory: .
        run: |
          docker buildx build \
            --builder default \
            --file Dockerfile.api \
            --load \
            --tag youtube-tool-api:latest .
